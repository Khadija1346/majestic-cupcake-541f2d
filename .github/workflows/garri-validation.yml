name: GARRI backup validation

on:
  push:
    branches:
      - backup/pre-upgrade-2026-11-10
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garri-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, typecheck and migration checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production build
        run: pnpm build

      - name: TypeScript validation
        run: pnpm exec tsc --noEmit

      - name: Drizzle migration consistency
        run: pnpm exec drizzle-kit check
